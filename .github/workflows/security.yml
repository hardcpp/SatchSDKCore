name: Security Scanning

on:
    push:
        branches:
            - stable
            - dev
    pull_request:
        branches: ["**"]
    schedule:
        # Run weekly on Monday at 9:00 UTC
        - cron: "0 9 * * 1"

env:
    DOTNET_VERSION: "10.0.x"

permissions:
    contents: read

jobs:
    codeql-analysis:
        name: CodeQL Analysis
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            # Initializes the CodeQL tools for scanning
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: csharp
                  queries: security-and-quality

            - name: Cache NuGet packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore

            - name: Build main project
              run: dotnet build src/SatchSDKCore/SatchSDKCore.csproj --configuration Release --no-restore

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:csharp"

    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Dependency Review
              uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: moderate
                  comment-summary-in-pr: true

    nuget-audit:
        name: NuGet Security Audit
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Run NuGet audit
              run: |
                  dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-audit.log
                  if grep -q "has the following vulnerable packages" nuget-audit.log; then
                    echo "::error::Vulnerable packages detected"
                    exit 1
                  fi

            - name: Upload audit results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: nuget-audit-results
                  path: nuget-audit.log
