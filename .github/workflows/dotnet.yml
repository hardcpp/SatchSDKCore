# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

env:
    DOTNET_VERSION: "9.0.x"

jobs:
    test-and-coverage:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Restore dependencies
              run: dotnet restore
            - name: Build
              run: dotnet build --no-restore
            - name: Run Unit Tests with Coverage
              run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./coverage
            - name: Code Coverage Report
              uses: irongut/CodeCoverageSummary@v1.3.0
              with:
                  filename: coverage/**/coverage.cobertura.xml
                  badge: true
                  fail_below_min: false
                  format: markdown
                  hide_branch_rate: false
                  hide_complexity: false
                  indicators: true
                  output: both
                  thresholds: "60 80"
            - name: Add Coverage PR Comment
              uses: marocchino/sticky-pull-request-comment@v2
              if: github.event_name == 'pull_request'
              with:
                  recreate: true
                  path: code-coverage-results.md
            - name: Write to Job Summary
              run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
            - name: Upload Test Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: "**/test-results.trx"
            - name: Upload Coverage Reports
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage-reports
                  path: "coverage/**/coverage.cobertura.xml"

    build:
        runs-on: ubuntu-latest
        needs: test-and-coverage
        if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/dev'

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Extract branch name
              id: extract_branch
              run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
            - name: Restore dependencies
              run: dotnet restore
            - name: Build Release
              run: dotnet build --configuration Release --no-restore
            - name: Create NuGet Package
              run: dotnet pack src/SatchSDKCore/SatchSDKCore.csproj --configuration Release --no-build --output ./packages /p:VersionSuffix=${{ steps.extract_branch.outputs.branch }}
            - name: Publish Application
              run: dotnet publish --configuration Release --no-build --output ./publish
            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifacts
                  path: ./publish
            - name: Upload NuGet Packages
              uses: actions/upload-artifact@v4
              with:
                  name: nuget-packages
                  path: ./packages/*.nupkg

    publish:
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/dev'
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download NuGet Packages
              uses: actions/download-artifact@v4
              with:
                  name: nuget-packages
                  path: ./packages
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Publish to GitHub Packages
              run: |
                  dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
                  dotnet nuget push ./packages/*.nupkg --source "github" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
