# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Publish

on:
    workflow_run:
        workflows: ["Code Quality"]
        types:
            - completed
        branches:
            - stable
            - dev

env:
    DOTNET_VERSION: "10.0.x"

jobs:
    discover-packages:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'stable' || github.event.workflow_run.head_branch == 'dev') }}
        outputs:
            packages: ${{ steps.discover.outputs.packages }}
            version-suffix: ${{ steps.discover.outputs.version-suffix }}

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - name: Discover NuGet projects
              id: discover
              shell: bash
              run: |
                  packages='[]'

                  while IFS= read -r -d '' project; do
                      name="$(basename "${project%.csproj}")"
                      packages="$(jq -c --arg project "$project" --arg name "$name" '. + [{project: $project, name: $name}]' <<< "$packages")"
                  done < <(find src -mindepth 2 -maxdepth 2 -type f -name '*.csproj' -print0 | sort -z)

                  if [ "$(jq 'length' <<< "$packages")" -eq 0 ]; then
                      echo "No projects were found under src/*" >&2
                      exit 1
                  fi

                  echo "packages=$packages" >> "$GITHUB_OUTPUT"
                  echo "version-suffix=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

    build:
        runs-on: ubuntu-latest
        needs: discover-packages
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJSON(needs.discover-packages.outputs.packages) }}

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Cache NuGet packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-
            - name: Restore dependencies
              run: dotnet restore "${{ matrix.package.project }}"
            - name: Build ${{ matrix.package.name }}
              run: dotnet build "${{ matrix.package.project }}" --configuration Release --no-restore
            - name: Pack ${{ matrix.package.name }}
              run: dotnet pack "${{ matrix.package.project }}" --configuration Release --no-build --output "./packages/${{ matrix.package.name }}" /p:VersionSuffix=${{ needs.discover-packages.outputs.version-suffix }}
            - name: Upload ${{ matrix.package.name }} NuGet package
              uses: actions/upload-artifact@v6
              with:
                  name: nuget-${{ matrix.package.name }}
                  path: ./packages/${{ matrix.package.name }}/*.nupkg
                  if-no-files-found: error

    publish:
        runs-on: ubuntu-latest
        needs: [discover-packages, build]
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJSON(needs.discover-packages.outputs.packages) }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download ${{ matrix.package.name }} NuGet package
              uses: actions/download-artifact@v7
              with:
                  name: nuget-${{ matrix.package.name }}
                  path: ./packages/${{ matrix.package.name }}
            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Publish to GitHub Packages
              run: |
                  dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
                  dotnet nuget push "./packages/${{ matrix.package.name }}/*.nupkg" --source "github" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
