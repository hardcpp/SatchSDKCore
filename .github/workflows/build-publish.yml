# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Publish

on:
    workflow_run:
        workflows: ["Code Quality"]
        types:
            - completed
        branches:
            - stable
            - dev

env:
    DOTNET_VERSION: "10.0.x"

jobs:
    build:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'stable' || github.event.workflow_run.head_branch == 'dev') }}

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Cache NuGet packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-
            - name: Extract branch name
              id: extract_branch
              run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
            - name: Restore dependencies
              run: dotnet restore
            - name: Build Release
              run: dotnet build --configuration Release --no-restore
            - name: Create NuGet Package
              run: dotnet pack src/SatchSDKCore/SatchSDKCore.csproj --configuration Release --no-build --output ./packages /p:VersionSuffix=${{ steps.extract_branch.outputs.branch }}
            - name: Publish Application
              run: dotnet publish --configuration Release --no-build --output ./publish
            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: build-artifacts
                  path: ./publish
            - name: Upload NuGet Packages
              uses: actions/upload-artifact@v6
              with:
                  name: nuget-packages
                  path: ./packages/*.nupkg

    publish:
        runs-on: ubuntu-latest
        needs: build
        if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'stable' || github.event.workflow_run.head_branch == 'dev') }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download NuGet Packages
              uses: actions/download-artifact@v7
              with:
                  name: nuget-packages
                  path: ./packages
            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Publish to GitHub Packages
              run: |
                  dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
                  dotnet nuget push ./packages/*.nupkg --source "github" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
